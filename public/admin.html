<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dropship Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <span class="logo">Admin Panel</span>
            <a href="index.html" class="cart-link">View Catalog</a>
        </div>
    </header>

    <main class="container">
        <!-- Login Form -->
        <div class="admin-login" id="admin-login">
            <h2 class="text-center">Admin Login</h2>
            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" class="form-control" placeholder="Enter admin password">
            </div>
            <button class="btn btn-primary btn-block" id="login-btn">Login</button>
            <p id="login-error" class="alert alert-error mt-16" style="display: none;">Incorrect password.</p>
        </div>

        <!-- Admin Panel -->
        <div class="admin-panel" id="admin-panel">
            <h1 class="page-title">Orders</h1>
            <p class="mb-16"><strong>Total Orders:</strong> <span id="total-orders">0</span></p>
            <div id="orders-message" class="alert" style="display: none;"></div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body">
                        <!-- Orders loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Admin panel logic (kept inline to keep it self-contained)
        const ADMIN_PASSWORD = 'admin123'; // MVP hardcoded password

        const loginSection = document.getElementById('admin-login');
        const adminPanel = document.getElementById('admin-panel');
        const passwordInput = document.getElementById('admin-password');
        const loginBtn = document.getElementById('login-btn');
        const loginError = document.getElementById('login-error');
        const ordersTableBody = document.getElementById('orders-table-body');
        const totalOrdersEl = document.getElementById('total-orders');
        const messageEl = document.getElementById('orders-message');

        // Check if already logged in this session
        if (sessionStorage.getItem('admin_logged_in') === 'true') {
            showAdminPanel();
        }

        loginBtn.addEventListener('click', () => {
            if (passwordInput.value === ADMIN_PASSWORD) {
                sessionStorage.setItem('admin_logged_in', 'true');
                showAdminPanel();
            } else {
                loginError.style.display = 'block';
            }
        });

        function showAdminPanel() {
            loginSection.style.display = 'none';
            adminPanel.classList.add('active');
            loadOrders();
        }

        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                if (!response.ok) throw new Error('Failed to load orders');
                const orders = await response.json();
                renderOrders(orders);
            } catch (error) {
                console.error(error);
                showMessage('Could not load orders.', 'error');
            }
        }

        function renderOrders(orders) {
            totalOrdersEl.textContent = orders.length;

            if (orders.length === 0) {
                ordersTableBody.innerHTML = '<tr><td colspan="7" class="text-center">No orders yet.</td></tr>';
                return;
            }

            ordersTableBody.innerHTML = orders.map(order => `
                <tr>
                    <td>#${order.id}</td>
                    <td>${order.product_name}</td>
                    <td>${order.customer_name}</td>
                    <td>${order.phone}</td>
                    <td><span class="badge badge-${order.status}">${order.status}</span></td>
                    <td>${new Date(order.created_at).toLocaleString()}</td>
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-primary btn-sm" onclick="updateStatus(${order.id}, 'processing')">Processing</button>
                            <button class="btn btn-success btn-sm" onclick="updateStatus(${order.id}, 'shipped')">Shipped</button>
                            <button class="btn btn-danger btn-sm" onclick="updateStatus(${order.id}, 'cancelled')">Cancelled</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function updateStatus(orderId, status) {
            try {
                const response = await fetch(`/api/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to update status');

                showMessage(`Order #${orderId} updated to ${status}.`, 'success');
                loadOrders();
            } catch (error) {
                console.error(error);
                showMessage(error.message, 'error');
            }
        }

        function showMessage(text, type) {
            messageEl.className = `alert alert-${type}`;
            messageEl.textContent = text;
            messageEl.style.display = 'block';
            setTimeout(() => { messageEl.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
