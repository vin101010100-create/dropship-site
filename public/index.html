<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog - Dropship Store</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Telegram WebApp JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">Dropship Store</a>
            <a href="cart.html" class="cart-link">
                Cart <span class="cart-count" id="cart-count">0</span>
            </a>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">Product Catalog</h1>
        <div id="product-grid" class="product-grid">
            <!-- Products are loaded here by app.js -->
        </div>
    </main>

    <!-- Product Details Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Product Details</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Product details are loaded here -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="modal-add-to-cart">Add to Cart</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
